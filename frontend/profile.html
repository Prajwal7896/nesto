<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Construction Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg: #F3F4F6;
            --surface: rgba(255, 255, 255, 0.8);
            --text-main: #1F2937;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); padding: 40px 20px; color: var(--text-main); }

        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 320px 1fr; gap: 24px; }

        .card { background: var(--surface); backdrop-filter: blur(10px); padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }

        .profile-header { text-align: center; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; background: #D1FAE5; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--primary); border: 4px solid white; }
        
        .field-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: #6B7280; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #D1D5DB; border-radius: 12px; background: white; }

        .sub-card { background: var(--primary); color: white; padding: 24px; border-radius: 20px; margin-top: 24px; }
        .sub-card h3 { margin-bottom: 8px; }
        .btn-upgrade { width: 100%; padding: 12px; background: white; color: var(--primary); border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 15px; }

        .btn-save { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">

    <aside class="card">
        <div class="profile-header">

            <div class="avatar">
                {% if user.image_url %}
                    <img src="{{ user.image_url }}"
                        style="width:120px;height:120px;border-radius:50%;object-fit:cover;">
                {% else %}
                    {{ user.name[0]|upper }}
                {% endif %}
            </div>

            <h2>{{ user.name }}</h2>
            <p>{{ user.role if user.role else "User" }}</p>
        </div>

        <div class="sub-card">
            <h3>{{ user.subscription_plan }}</h3>
            <p>Active Subscription</p>

            <button class="btn-upgrade">
                Upgrade Plan
            </button>
        </div>
    </aside>


    <main class="card">

        <form action="/profile/update"
              method="POST"
              enctype="multipart/form-data">

            <h2 style="margin-bottom:24px;">
                Personal Information
            </h2>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

                <div class="field-group">
                    <label>Full Name</label>
                    <input
                        type="text"
                        name="name"
                        value="{{ user.name }}">
                </div>

                <div class="field-group">
                    <label>Email</label>
                    <input
                        type="email"
                        name="email"
                        value="{{ user.email }}">
                </div>

                <div class="field-group">
                    <label>Phone Number</label>
                    <input
                        type="text"
                        name="phone_number"
                        value="{{ user.phone_number or '' }}">
                </div>

                <div class="field-group">
                    <label>Age</label>
                    <input
                        type="number"
                        name="age"
                        value="{{ user.age if user.age else '' }}">
                </div>

                <div class="field-group">
                    <label>Role</label>
                    <input
                        type="text"
                        name="role"
                        value="{{ user.role if user.role else '' }}">
                </div>

                <div class="field-group">
                    <label>Subscription</label>
                    <input
                        type="text"
                        value="{{ user.subscription_plan }}"
                        readonly>
                </div>

                <div class="field-group" style="grid-column:1 / span 2;">
                    <label>Profile Image</label>
                    <input
                        type="file"
                        name="profile_image">
                </div>

            </div>

            <div style="margin-top:30px;display:flex;gap:12px;">
                <button
                    class="btn-save"
                    type="submit">
                    Save Changes
                </button>

                <button
                    type="reset"
                    style="padding:12px 24px;border:none;border-radius:12px;background:#E5E7EB;cursor:pointer;">
                    Reset
                </button>
            </div>

        </form>

    </main>

</div>

</body>
</html>
